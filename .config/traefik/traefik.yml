api:
  dashboard: true

entryPoints:
  web:
    address: :80
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: :443
    http:
      tls: {}

log:
  level: INFO
  format: common

providers:
  file:
    directory: /etc/traefik/conf.d
    watch: true

